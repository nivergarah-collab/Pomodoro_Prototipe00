# Construye el APK de depuracion de PomoStudy y lo deja como archivo descargable.
# Para bajarlo: pestana Actions > ejecucion "APK" de la rama > seccion Artifacts > pomostudy-debug-apk.
# Sin verificar todavia: el primer intento puede fallar por versiones (AGP 9.1.1, Gradle 9.3.1).
name: APK

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Crear debug.keystore (no se versiona)
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Construir APK de depuracion
        run: |
          set +e
          gradle assembleDebug --console=plain > salida.txt 2>&1
          codigo=$?
          if [ $codigo -ne 0 ]; then
            resumen=$(tail -40 salida.txt | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Resumen del fallo::$resumen"
          fi
          exit $codigo

      - uses: actions/upload-artifact@v4
        with:
          name: pomostudy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
