# Integracion continua de PomoStudy: verificacion de estructura y pruebas unitarias.
# El repositorio no trae gradlew, por eso se usa Gradle 9.3.1 directamente.
name: Pruebas

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Verificar estructura del proyecto
        shell: pwsh
        run: ./scripts/verificar-estructura.ps1

      - name: Crear debug.keystore (no se versiona)
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Pruebas unitarias
        run: gradle testDebugUnitTest --console=plain -q
