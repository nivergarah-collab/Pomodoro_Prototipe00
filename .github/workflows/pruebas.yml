# Integracion continua de PomoStudy: verificacion de estructura y pruebas unitarias.
# El repositorio no trae gradlew, por eso se usa Gradle 9.3.1 directamente.
name: Pruebas

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Verificar estructura del proyecto
        shell: pwsh
        run: ./scripts/verificar-estructura.ps1

      - name: Crear debug.keystore (no se versiona)
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pruebas unitarias
        run: |
          set +e
          gradle testDebugUnitTest --console=plain > salida.txt 2>&1
          codigo=$?
          if [ $codigo -ne 0 ]; then
            resumen=$(tail -40 salida.txt | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Resumen del fallo::$resumen"
          fi
          exit $codigo
